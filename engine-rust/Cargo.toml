[package]
name = "engine-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "clio_engine"
path = "src/lib.rs"

[[bin]]
name = "clio-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
http = "1.5.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
