services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public anon key}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./frontend/.env.local
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set a random AUTH_SECRET in frontend/.env.local}
      CLIO_ENGINE_URL: http://engine:8088
      CLIO_ENGINE_KEY: ${CLIO_ENGINE_KEY:?Set a shared CLIO_ENGINE_KEY in frontend/.env.local}

  engine:
    build:
      context: ./engine-rust
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      PORT: 8088
      CLIO_ENGINE_HOST: 0.0.0.0
      CLIO_ENGINE_REQUIRE_KEY: "true"
      CLIO_ENGINE_KEY: ${CLIO_ENGINE_KEY:?Set a shared CLIO_ENGINE_KEY in frontend/.env.local}
